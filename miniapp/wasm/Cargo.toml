[package]
name = "chatgpt-auto-confirm-web-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license-file = "../../LICENSE"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fabushi-chatgpt-domain = { path = "../../crates/domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.129"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
