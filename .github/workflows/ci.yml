name: ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: architecture
        run: ./scripts/check-architecture.sh
      - name: fmt
        run: cargo fmt --all -- --check
      - name: test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: release build
        run: cargo build --release -p fabushi-chatgpt-auto-confirm

  desktop-dom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install fixture runtime
        run: npm install --no-save playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Sanitized desktop DOM contracts
        run: node scripts/test-desktop-dom.cjs
